schemaVersion: "1"
targets:
  certification:
    organization: example-org
    project: Example Project
    definition:
      name: Example Application
    environment:
      name: Deploy Certification
    selection:
      strategy: latestSuccessfulDeployment
operations:
  integration-mode:
    description: Cambiar el modo de integración y redesplegar certificación
    target: certification
    modes: [simulated, live]
    variables:
      - name: integration-enabled
        scope: release
        mustExist: true
        values:
          simulated: "true"
          live: "false"
      - name: integration-mode
        scope: environment
        mustExist: false
        values:
          simulated: "simulation"
          live: "production-service"
    deployment:
      strategy: environmentRedeploy
      # allow acepta dependencias conocidas y muestra advertencias; no las modifica.
      downstreamPolicy: reject
      # true permite reaplicar la configuración actual sin actualizar variables.
      redeployWhenUnchanged: false
    approvals: external
    planTtlMinutes: 15
    trackingTimeoutMinutes: 1440
